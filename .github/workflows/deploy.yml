name: Deploy Frontend Centac (Develop / Staging)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: 3. Instalar dependencias y Construir (Build)
        run: |
          npm install
          npm run build

      - name: 4. Desplegar archivos al VPS de Validación
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*" # Cambiar a "build/*" si usan Create React App
          target: "/var/www/centac.co"
          strip_components: 1